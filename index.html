<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kas Astravelis</title>
    
    <link rel="manifest" href='data:application/manifest+json,{
      "name": "Kas Astravelis",
      "short_name": "Kas Astravelis",
      "start_url": ".",
      "display": "standalone",
      "background_color": "#ffffff",
      "theme_color": "#2563eb",
      "icons": [
        { "src": "logo.jpg", "sizes": "192x192", "type": "image/jpeg" },
        { "src": "logo.jpg", "sizes": "512x512", "type": "image/jpeg" }
      ]
    }'>
    <link class="flex" rel="apple-touch-icon" href="logo.jpg">
    <link rel="icon" type="image/jpeg" href="logo.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #cbd5e1; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2563eb; }
        input:checked + .slider:before { transform: translateX(24px); }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8 font-sans text-slate-800">

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-6">
            <div class="flex items-center gap-4">
                <img id="logoApp" src="logo.jpg" alt="Logo" class="h-14 w-14 object-contain rounded-2xl shadow-md border-2 border-white">
                <div>
                    <h1 class="text-3xl font-black italic uppercase leading-none">KAS <span class="text-blue-600">ASTRAVELIS</span></h1>
                    <p id="realtimeClock" class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1 italic"></p>
                    <p id="infoBulan" class="text-[9px] font-bold text-blue-400 uppercase tracking-widest mt-0.5 italic">Menghubungkan...</p>
                </div>
            </div>

            <div class="flex gap-2 items-center">
                <button onclick="kurangiBulan()" class="p-3 bg-white text-red-500 rounded-2xl shadow-sm border hover:bg-red-50 transition text-[10px] font-bold uppercase italic">➖ Edit Tagihan</button>
                <div class="bg-white p-3 rounded-2xl shadow-sm border flex items-center gap-3">
                    <div class="text-right">
                        <p class="text-[9px] font-black text-slate-400 uppercase">Tambah Tagihan</p>
                        <p id="statusSaklar" class="text-[10px] font-bold text-red-500 uppercase italic">Libur/Off</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="btnSaklar" onchange="toggleIuran()">
                        <span class="slider"></span>
                    </label>
                </div>
                <button onclick="muatData()" class="p-4 bg-white rounded-2xl shadow-sm border hover:bg-slate-100 transition">🔄</button>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-blue-600 p-6 rounded-[2.5rem] text-white shadow-xl md:col-span-2">
                <p class="text-[10px] font-black uppercase opacity-70 italic">Total Saldo Fisik</p>
                <h2 id="totalSaldo" class="text-5xl font-black tracking-tighter">Rp 0</h2>
                <div class="mt-6 flex gap-6 text-[11px] font-bold border-t border-blue-400 pt-4">
                    <p>MASUK (BLN INI): <span id="mBulanIni" class="text-green-300">+0</span></p>
                    <p>KELUAR (BLN INI): <span id="kBulanIni" class="text-red-300">-0</span></p>
                </div>
            </div>
            <div class="bg-white p-6 rounded-[2.5rem] border shadow-sm flex flex-col justify-center">
                <p class="text-[10px] font-black uppercase text-slate-400 italic">Piutang Kelas</p>
                <h2 id="sisaPiutang" class="text-3xl font-black text-red-500">Rp 0</h2>
                <p class="text-[9px] mt-1 text-slate-400 font-bold">*Sinkron Seluruh Perangkat</p>
            </div>
            <div class="bg-white p-6 rounded-[2.5rem] border shadow-sm flex items-center justify-center">
                <canvas id="miniChart" class="max-h-20"></canvas>
            </div>
        </div>

        <div class="mb-8">
            <button onclick="bukaLaporanSiswa()" class="w-full bg-white border-2 border-blue-600 text-blue-600 font-black py-4 rounded-2xl hover:bg-blue-600 hover:text-white transition uppercase text-xs tracking-widest shadow-sm">
                📊 Lihat Laporan Detail & Tunggakan Per Siswa
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white p-8 rounded-[2rem] border shadow-sm">
                    <h3 class="text-xs font-black uppercase mb-6 text-slate-400 tracking-widest italic">Input Transaksi</h3>
                    <form id="kasForm" class="space-y-4">
                        <input type="password" id="inputPin" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-center font-black tracking-[0.5em] focus:ring-2 focus:ring-blue-500 outline-none" placeholder="PIN ADMIN">
                        
                        <div class="relative">
                            <input type="text" id="nama" list="listAnggota" class="w-full p-4 border rounded-2xl outline-none focus:ring-2 focus:ring-blue-500 font-bold uppercase" placeholder="Nama Siswa" required autocomplete="off">
                            <datalist id="listAnggota"></datalist>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-2">
                            <select id="tipe" class="p-4 border rounded-2xl font-bold text-xs outline-none" onchange="sesuaikanFormOtomatis()">
                                <option value="Masuk">Masuk (+)</option>
                                <option value="Keluar">Keluar (-)</option>
                            </select>
                            <select id="kategori" class="p-4 border rounded-2xl font-bold text-xs outline-none" onchange="sesuaikanFormOtomatis()">
                                <option value="Iuran">Iuran</option>
                                <option value="Sosial">Sosial</option>
                                <option value="Alat Kelas">Alat Kelas</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>

                        <div id="boxBayarSekaligus" class="p-3 bg-blue-50 rounded-2xl border border-blue-100">
                            <label class="text-[9px] font-black text-blue-600 uppercase ml-1">Bayar Berapa Bulan?</label>
                            <select id="jumlahBulanBayar" class="w-full bg-transparent font-bold text-sm outline-none cursor-pointer" onchange="sesuaikanFormOtomatis()">
                                <option value="1">1 Bulan (Normal)</option>
                                <option value="2">2 Bulan Sekaligus</option>
                                <option value="3">3 Bulan Sekaligus</option>
                                <option value="4">4 Bulan Sekaligus</option>
                                <option value="5">5 Bulan Sekaligus</option>
                                <option value="6">6 Bulan Sekaligus</option>
                            </select>
                        </div>
                        
                        <input type="text" id="keterangan" class="w-full p-4 border rounded-2xl outline-none" placeholder="Keterangan..." required>
                        <input type="number" id="jumlah" class="w-full p-4 border rounded-2xl outline-none font-black text-blue-600 text-lg" placeholder="Nominal Rp" required>
                        
                        <button type="submit" id="btnSimpan" class="w-full bg-blue-600 text-white font-black py-5 rounded-2xl hover:bg-blue-700 transition shadow-lg uppercase text-sm tracking-widest italic">Simpan Data</button>
                    </form>
                </div>

                <div class="bg-white p-8 rounded-[2rem] border shadow-sm">
                    <h3 class="text-xs font-black uppercase mb-4 text-slate-400 tracking-widest italic">Ringkasan Pengeluaran</h3>
                    <div id="ringkasanKategori" class="space-y-3"></div>
                </div>
            </div>

            <div class="lg:col-span-3 bg-white p-8 rounded-[2rem] border shadow-sm">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                    <h3 class="text-xs font-black uppercase text-slate-400 tracking-widest italic">Riwayat Transaksi</h3>
                    <div class="flex gap-2">
                        <button onclick="unduhCSV()" class="px-4 py-2 bg-green-50 text-green-600 rounded-xl font-black text-[10px] border border-green-100 hover:bg-green-600 hover:text-white transition uppercase">Export Excel</button>
                        <button onclick="unduhPDF()" class="px-4 py-2 bg-red-50 text-red-600 rounded-xl font-black text-[10px] border border-red-100 hover:bg-red-600 hover:text-white transition uppercase">Cetak PDF</button>
                    </div>
                </div>
                <div class="overflow-y-auto max-h-[600px] custom-scrollbar">
                    <table class="w-full text-left">
                        <tbody id="tabelBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="modalLaporan" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-[2.5rem] shadow-2xl overflow-hidden overflow-y-auto max-h-[90vh]">
            <div class="p-8 border-b flex justify-between items-center bg-slate-50 sticky top-0 z-10">
                <div>
                    <h3 class="font-black text-xl uppercase italic">Laporan <span class="text-blue-600">Tunggakan</span></h3>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Tagihan Kelas: <span id="labelTagihan">0</span> Bulan</p>
                </div>
                <div class="flex gap-2">
                    <button onclick="copyPenunggak()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase hover:bg-blue-700 transition">📋 Salin WhatsApp</button>
                    <button onclick="tutupLaporan()" class="text-slate-400 hover:text-red-500 font-bold text-2xl">✕</button>
                </div>
            </div>
            <div class="p-4">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-[10px] font-black text-slate-400 uppercase border-b">
                            <th class="p-4">Siswa</th>
                            <th class="p-4">Dibayar</th>
                            <th class="p-4 text-right">Sisa</th>
                        </tr>
                    </thead>
                    <tbody id="tabelLaporanSiswa" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbw9HX9zRlkd7FUXJfAjOpN8mn4Xn6FuwoaWekoAgkXMUsWBXeZ6abtSkxeJe6bQH0Th/exec';
        const ADMIN_PIN = "0101";
        const NOMINAL_IURAN = 10000;
        
        let dataLokal = [], listSiswa = [], myChart;
        let bulanAktif = 0;

        function updateClock() {
            const now = new Date();
            document.getElementById('realtimeClock').innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        }
        setInterval(updateClock, 1000);

        async function muatData() {
            document.getElementById('infoBulan').innerText = "MENYINGKRONKAN...";
            try {
                const res = await fetch(scriptURL);
                const json = await res.json();
                dataLokal = json.transaksi || [];
                listSiswa = (json.anggota || []).map(n => n.toString().trim());
                bulanAktif = parseInt(json.bulanAktif) || 0;
                document.getElementById('listAnggota').innerHTML = listSiswa.map(n => `<option value="${n}">`).join('');
                updateUI();
                sesuaikanFormOtomatis();
            } catch (e) { document.getElementById('infoBulan').innerText = "OFFLINE"; }
        }

        async function sinkronBulanKeCloud(nilaiBaru) {
            document.getElementById('infoBulan').innerText = "MENYIMPAN...";
            try {
                await fetch(scriptURL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: "updateBulan", nilai: nilaiBaru }) 
                });
                muatData();
            } catch (e) { alert("Gagal koneksi ke cloud!"); }
        }

        async function kurangiBulan() {
            const pin = prompt("PIN ADMIN:");
            if(pin === ADMIN_PIN) {
                const perintah = prompt("Ketik 'KURANG' untuk -1 bulan, atau 'RESET' untuk nol kan semua:");
                if(!perintah) return;
                
                let baru = bulanAktif;
                if(perintah.toUpperCase() === 'RESET') {
                    if(confirm("Yakin hapus semua tagihan menjadi 0?")) baru = 0;
                } else if(perintah.toUpperCase() === 'KURANG' && bulanAktif > 0) {
                    baru = bulanAktif - 1;
                } else {
                    alert("Perintah salah atau tagihan sudah 0.");
                    return;
                }
                await sinkronBulanKeCloud(baru);
            } else if (pin !== null) alert("PIN SALAH!");
        }

        async function toggleIuran() { 
            if(confirm("Tambah tagihan 1 bulan?")) { 
                await sinkronBulanKeCloud(bulanAktif + 1);
            } 
            document.getElementById('btnSaklar').checked = false; 
        }

        function sesuaikanFormOtomatis() {
            const jmlBulan = parseInt(document.getElementById('jumlahBulanBayar').value) || 1;
            const kategori = document.getElementById('kategori').value;
            const tipe = document.getElementById('tipe').value;
            const boxBulan = document.getElementById('boxBayarSekaligus');

            if (kategori === "Iuran" && tipe === "Masuk") {
                boxBulan.style.display = "block";
                document.getElementById('jumlah').value = jmlBulan * NOMINAL_IURAN;
                document.getElementById('keterangan').value = `Bayar kas untuk ${jmlBulan} bulan`;
            } else {
                boxBulan.style.display = "none";
                if (kategori !== "Iuran") {
                    if(document.getElementById('keterangan').value.startsWith("Bayar kas")) {
                        document.getElementById('keterangan').value = "";
                        document.getElementById('jumlah').value = "";
                    }
                }
            }
        }

        document.getElementById('kasForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pin = document.getElementById('inputPin').value;
            const namaInput = document.getElementById('nama').value.trim();
            
            if(pin !== ADMIN_PIN) { alert("PIN SALAH!"); return; }
            
            const namaValid = listSiswa.find(n => n.toUpperCase() === namaInput.toUpperCase());
            if(!namaValid) { alert("NAMA TIDAK TERDAFTAR!"); return; }

            const btn = document.getElementById('btnSimpan');
            btn.innerText = "PROSES..."; btn.disabled = true;

            const payload = { 
                nama: namaValid, 
                keterangan: `[${document.getElementById('kategori').value}] ${document.getElementById('keterangan').value}`, 
                jumlah: document.getElementById('jumlah').value, 
                tipe: document.getElementById('tipe').value 
            };

            let barisKosong = 2; 
            for (let i = 0; i < dataLokal.length; i++) {
                if (!dataLokal[i][0] || dataLokal[i][0].toString().trim() === "") {
                    barisKosong = i + 2;
                    break;
                }
                if (i === dataLokal.length - 1) {
                    barisKosong = dataLokal.length + 2;
                }
            }

            try {
                await fetch(scriptURL, { 
                    method: 'POST', 
                    body: JSON.stringify({ ...payload, action: "insertAt", targetRow: barisKosong }) 
                });
                document.getElementById('nama').value = "";
                document.getElementById('keterangan').value = "";
                document.getElementById('jumlah').value = "";
                document.getElementById('jumlahBulanBayar').value = "1";
                muatData();
            } catch (e) { alert("Gagal Simpan!"); }
            finally { btn.innerText = "Simpan Data"; btn.disabled = false; }
        });

        function updateUI() {
            let mTotal = 0, kTotal = 0, mBulanIni = 0, kBulanIni = 0;
            const sekarang = new Date();
            const saldoTrend = [];
            const pengeluaranKategori = { "Sosial": 0, "Alat Kelas": 0, "Lainnya": 0 };

            dataLokal.forEach(r => {
                if (!r[0] || r[0].toString().trim() === "" || !r[1] || r[1].toString().trim() === "") return;

                const tgl = new Date(r[0]);
                const jml = parseInt(r[3]) || 0;
                const tipe = r[4];
                const ket = r[2] || "";

                if(tipe === 'Masuk') mTotal += jml;
                else {
                    kTotal += jml;
                    if(ket.includes("[Sosial]")) pengeluaranKategori["Sosial"] += jml;
                    else if(ket.includes("[Alat Kelas]")) pengeluaranKategori["Alat Kelas"] += jml;
                    else pengeluaranKategori["Lainnya"] += jml;
                }

                if(!isNaN(tgl.getTime())) {
                    if(tgl.getMonth() === sekarang.getMonth() && tgl.getFullYear() === sekarang.getFullYear()) {
                        if(tipe === 'Masuk') mBulanIni += jml; else kBulanIni += jml;
                    }
                }
                saldoTrend.push(mTotal - kTotal);
            });

            document.getElementById('ringkasanKategori').innerHTML = Object.entries(pengeluaranKategori).map(([k, v]) => `
                <div class="flex justify-between border-b pb-1 text-xs"><span>${k}</span><span class="font-bold text-red-500">Rp ${v.toLocaleString()}</span></div>
            `).join('');

            const target = bulanAktif * NOMINAL_IURAN;
            let piutang = 0;
            
            listSiswa.forEach(n => {
                const bayar = dataLokal.filter(t => t[1] && t[1].toString().trim() === n && t[4] === 'Masuk' && t[2].includes("[Iuran]")).reduce((a, b) => a + (parseInt(b[3]) || 0), 0);
                if(bayar < target) piutang += (target - bayar);
            });

            document.getElementById('totalSaldo').innerText = "Rp " + (mTotal - kTotal).toLocaleString('id-ID');
            document.getElementById('sisaPiutang').innerText = "Rp " + piutang.toLocaleString('id-ID');
            document.getElementById('mBulanIni').innerText = "+" + mBulanIni.toLocaleString('id-ID');
            document.getElementById('kBulanIni').innerText = "-" + kBulanIni.toLocaleString('id-ID');
            document.getElementById('infoBulan').innerText = `TAGIHAN: ${bulanAktif} BULAN`;

            renderTabel();
            renderMiniChart(saldoTrend.length > 0 ? saldoTrend.slice(-10) : [0]);
        }

        function renderTabel() {
            const body = document.getElementById('tabelBody');
            const dataValid = dataLokal.filter(r => r[0] && r[1] && r[3] && r[0].toString().trim() !== "" && r[1].toString().trim() !== "");

            if (dataValid.length === 0) {
                body.innerHTML = `<tr><td colspan="3" class="py-8 text-center text-slate-400 italic text-xs">Belum ada riwayat transaksi aktif.</td></tr>`;
                return;
            }

            body.innerHTML = dataValid.slice().reverse().map((r, idx) => {
                const realIdx = dataLokal.findIndex(originalRow => originalRow === r);
                const nominal = parseInt(r[3]) || 0;
                return `<tr class="border-b text-xs">
                    <td class="py-3"><b>${r[1]}</b><br><small class="text-slate-400">${r[2]}</small></td>
                    <td class="text-right font-bold ${r[4] === 'Masuk' ? 'text-green-600' : 'text-red-600'}">Rp ${nominal.toLocaleString('id-ID')}</td>
                    <td class="text-right"><button onclick="hapusData(${realIdx})" class="text-slate-300 hover:text-red-500">✕</button></td>
                </tr>`;
            }).join('');
        }

        async function hapusData(idx) {
            const p = prompt("PIN:");
            if(p === ADMIN_PIN && confirm("Hapus?")) {
                await fetch(scriptURL, { method: 'POST', body: JSON.stringify({action: 'delete', row: idx}) });
                muatData();
            }
        }

        function renderMiniChart(data) {
            const ctx = document.getElementById('miniChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, { type: 'line', data: { labels: data.map((_, i) => i), datasets: [{ data: data, borderColor: '#2563eb', fill: true, backgroundColor: 'rgba(37, 99, 235, 0.1)', tension: 0.4, pointRadius: 0 }] }, options: { scales: { x: { display: false }, y: { display: false } }, plugins: { legend: { display: false } } } });
        }

        function bukaLaporanSiswa() {
            const target = bulanAktif * NOMINAL_IURAN;
            document.getElementById('labelTagihan').innerText = bulanAktif;
            document.getElementById('tabelLaporanSiswa').innerHTML = listSiswa.map(n => {
                const bayar = dataLokal.filter(t => t[1] && t[1].toString().trim() === n && t[4] === 'Masuk' && t[2].includes("[Iuran]")).reduce((a, b) => a + (parseInt(b[3]) || 0), 0);
                const sisa = Math.max(0, target - bayar);
                return `<tr class="border-b text-xs"><td class="p-3">${n}</td><td class="p-3">Rp ${bayar.toLocaleString('id-ID')}</td><td class="p-3 text-right font-bold ${sisa > 0 ? 'text-red-500' : 'text-green-600'}">${sisa > 0 ? 'Rp ' + sisa.toLocaleString('id-ID') : 'LUNAS'}</td></tr>`;
            }).join('');
            document.getElementById('modalLaporan').classList.remove('hidden');
        }

        function copyPenunggak() {
            const target = bulanAktif * NOMINAL_IURAN;
            let teks = "*📢 PENGINGAT TUNGGAKAN KAS ASTRAVELIS 📢*\n\n";
            let adaPenunggak = false;
            
            listSiswa.forEach(n => {
                const bayar = dataLokal.filter(t => t[1] && t[1].toString().trim() === n && t[4] === 'Masuk' && t[2].includes("[Iuran]")).reduce((a, b) => a + (parseInt(b[3]) || 0), 0);
                const tunggakan = target - bayar;
                if(tunggakan > 0) {
                    teks += `🔹 *${n}* (Kurang: Rp ${tunggakan.toLocaleString('id-ID')})\n`;
                    adaPenunggak = true;
                }
            });
            
            if(!adaPenunggak) teks += "Alhamdulillah, semua siswa sudah melunasi kas kelas! 🎉";
            
            navigator.clipboard.writeText(teks);
            alert("Daftar penunggak Kas Astravelis disalin ke clipboard!");
        }

        function tutupLaporan() { document.getElementById('modalLaporan').classList.add('hidden'); }
        function unduhCSV() { window.open(scriptURL + "?action=export"); }
        
        // MODIFIKASI: Fitur Cetak PDF Modern dengan kolom Tanggal, Tipe, Nama, Keterangan, dan Jumlah
        function unduhPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            
            const sekarang = new Date();
            const namaBulan = sekarang.toLocaleDateString('id-ID', { month: 'long' });
            const tahun = sekarang.getFullYear();
            const tglCetakFormat = sekarang.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            const jamCetakFormat = navigator.userAgent.includes("Mobi") 
                ? sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
                : Thermal = sekarang.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }).replace('.', ':');

            // Fungsi untuk membuat struktur halaman (Kop Surat & Judul)
            const buatKopSurat = () => {
                const imgLogo = document.getElementById('logoApp');
                
                try {
                    // Ambil Logo secara dinamis dari elemen Gambar web lalu diubah ke format base64 aman jsPDF
                    const canvas = document.createElement('canvas');
                    canvas.width = imgLogo.naturalWidth || 200;
                    canvas.height = imgLogo.naturalHeight || 200;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(imgLogo, 0, 0);
                    const base64Img = canvas.toDataURL('image/jpeg', 0.8);
                    
                    // Taruh Logo di sebelah kiri atas kop surat
                    doc.addImage(base64Img, 'JPEG', 14, 10, 20, 20);
                } catch(e) {
                    console.log("Gagal memuat logo fisik, digantikan kotak representatif.");
                }

                // Teks Utama Kop Surat di sebelah kanan Logo
                doc.setFont("helvetica", "bold");
                doc.setTextColor('#1a365d'); // Navy Gelap Astravelis
                doc.setFontSize(22);
                doc.text("LAPORAN KAS ASTRAVELIS", 38, 18);
                
                // Sub-info detail tanggal cetak dan periode bulan
                doc.setFont("helvetica", "normal");
                doc.setFontSize(10);
                doc.setTextColor('#64748b'); // Slate Gray
                doc.text(`Kas Bulan: ${namaBulan} ${tahun}`, 38, 24);
                doc.text(`Tanggal Cetak: ${tglCetakFormat} pukul ${jamCetakFormat}`, 38, 29);
                
                // Garis Tebal Estetik Pembatas Kop Surat (Warna Biru Khas)
                doc.setDrawColor('#2563eb');
                doc.setLineWidth(1.2);
                doc.line(14, 34, 196, 34);
            };

            // Jalankan render kop surat di halaman pertama
            buatKopSurat();

            // Hitung kalkulasi total transaksi kas masuk dan keluar
            let totalMasuk = 0;
            let totalKeluar = 0;
            
            // Susun baris isi tabel sesuai permintaan baru: Tanggal, Tipe, Nama, Keterangan, Jumlah
            const rows = dataLokal.filter(r => r[0] && r[1]).map(r => {
                const nominal = parseInt(r[3]) || 0;
                const tipeFormat = r[4] === 'Masuk' ? 'Masuk' : 'Keluar';
                
                if(r[4] === 'Masuk') totalMasuk += nominal;
                else totalKeluar += nominal;
                
                return [
                    r[0],                                  // Kolom 1: Tanggal
                    tipeFormat,                            // Kolom 2: Tipe
                    r[1],                                  // Kolom 3: Nama (Dipisahkan dari keterangan)
                    r[2],                                  // Kolom 4: Keterangan / Keperluan
                    `Rp ${nominal.toLocaleString('id-ID')}` // Kolom 5: Jumlah Nominal
                ];
            });

            // Pembuatan Struktur AutoTable Utama
            doc.autoTable({
                head: [['Tanggal', 'Tipe', 'Nama', 'Keterangan / Keperluan', 'Jumlah']],
                body: rows,
                startY: 40,
                theme: 'striped',
                headStyles: {
                    fillColor: '#2563eb', // Warna Biru Terang
                    textColor: '#ffffff',
                    font: "helvetica",
                    fontStyle: "bold",
                    fontSize: 10,
                    halign: 'left'
                },
                bodyStyles: {
                    font: "helvetica",
                    fontSize: 9,
                    textColor: '#334155'
                },
                columnStyles: {
                    1: { fontStyle: 'bold' },
                    2: { fontStyle: 'bold' }, // Membuat kolom Nama tercetak tebal
                    4: { halign: 'right', fontStyle: 'bold' } // Angka Jumlah rata kanan
                },
                didParseCell: function(data) {
                    // Mewarnai baris kata "Masuk" (Hijau) atau "Keluar" (Merah) di Kolom Tipe (Indeks ke-1)
                    if (data.column.index === 1 && data.cell.section === 'body') {
                        if (data.cell.text[0] === 'Masuk') {
                            data.cell.styles.textColor = '#16a34a'; 
                        } else if (data.cell.text[0] === 'Keluar') {
                            data.cell.styles.textColor = '#dc2626';
                        }
                    }
                },
                // Otomatis tambahkan kop surat jika isi tabel berlanjut ke lembar halaman kedua
                addPageContent: function(data) {
                    if (doc.internal.getNumberOfPages() > 1) {
                        buatKopSurat();
                    }
                }
            });
            
            // Perhitungan koordinat posisi penempatan Summary Box di akhir tabel
            const finalY = doc.lastAutoTable.finalY + 10;
            const startX = 110; 
            
            // Validasi apakah sisa ruang halaman mencukupi, jika sempit otomatis dipindah ke halaman baru
            if (finalY > 250) {
                doc.addPage();
                buatKopSurat();
            }
            
            // Render Garis Pembatas Atas Summary Box
            doc.setDrawColor('#cbd5e1');
            doc.setLineWidth(0.5);
            doc.line(startX, finalY, 196, finalY);
            
            doc.setFontSize(10);
            doc.setTextColor('#334155');
            
            // Bagian Baris: Total Masuk
            doc.setFont("helvetica", "bold");
            doc.text("Total Masuk:", startX, finalY + 7);
            doc.setTextColor('#16a34a'); // Hijau
            doc.text(`Rp ${totalMasuk.toLocaleString('id-ID')}`, 196, finalY + 7, { align: 'right' });
            
            // Bagian Baris: Total Keluar
            doc.setFont("helvetica", "bold");
            doc.setTextColor('#334155');
            doc.text("Total Keluar:", startX, finalY + 14);
            doc.setTextColor('#dc2626'); // Merah
            doc.text(`Rp ${totalKeluar.toLocaleString('id-ID')}`, 196, finalY + 14, { align: 'right' });
            
            // Garis Pembatas Tengah
            doc.setDrawColor('#cbd5e1');
            doc.line(startX, finalY + 19, 196, finalY + 19);
            
            // Bagian Baris Akhir: Sisa Saldo Bersih Utama
            doc.setFontSize(11);
            doc.setFont("helvetica", "bold");
            doc.setTextColor('#1a365d'); // Navy Gelap
            doc.text("Sisa Saldo Bersih:", startX, finalY + 26);
            doc.text(`Rp ${(totalMasuk - totalKeluar).toLocaleString('id-ID')}`, 196, finalY + 26, { align: 'right' });
            
            // Eksekusi Download Penyimpanan File PDF
            doc.save(`Laporan_Kas_Astravelis_${namaBulan}_${tahun}.pdf`);
        }

        muatData();
    </script>
</body>
</html>
